services:
  - type: web
    name: stockmaster-backend
    runtime: java
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: java -Dspring.profiles.active=prod -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://stockmaster-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: stockmaster-db
          property: connectionString

databases:
  - name: stockmaster-db
    databaseName: stockmaster
    user: stockmaster
    plan: free
    region: frankfurt
