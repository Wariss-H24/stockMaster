spring.application.name=backend

# Base H2 en mémoire pour le développement
spring.datasource.url=jdbc:h2:mem:stockdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT : clé secrète (min 256 bits) + durée de validité en ms (24h)
jwt.secret=StockMasterSecretKey2024XyZ!@#$%^&*SuperLongSecretForHS256Algorithm
jwt.expiration=86400000
