# ══════════════════════════════════════════════════════════════════════════════
# PRODUCTION — Render.com + PostgreSQL
# ══════════════════════════════════════════════════════════════════════════════

# Render donne DATABASE_URL — le docker-entrypoint.sh la convertit en SPRING_DATASOURCE_URL
# Spring Boot utilise automatiquement SPRING_DATASOURCE_URL s'il est défini
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Boot 3 auto-détecte le driver depuis l'URL — pas besoin de username/password séparés
# si DATABASE_URL contient déjà les credentials

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Désactiver H2 en prod
spring.h2.console.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Port Render
server.port=${PORT:8080}

# CORS
stockmaster.cors.allowed-origins=${FRONTEND_URL:https://stockmaster-frontend.vercel.app}

# QR Code
stockmaster.app.url=${FRONTEND_URL:https://stockmaster-frontend.vercel.app}

# Alertes
stockmaster.alert.email.to=${ALERT_EMAIL:admin@stockmaster.com}
