# ══════════════════════════════════════════════════════════════════════════════
# PRODUCTION — Render.com + PostgreSQL
# Ces variables sont définies dans le Dashboard Render → Environment
# ══════════════════════════════════════════════════════════════════════════════

# ── Base de données PostgreSQL Render ────────────────────────────────────────
# Render injecte DATABASE_URL automatiquement si tu crées un DB lié au service
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── H2 désactivé en prod ──────────────────────────────────────────────────────
spring.h2.console.enabled=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Port imposé par Render ────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── CORS — URL de ton frontend Vercel ─────────────────────────────────────────
# Remplacer par ton URL Vercel après déploiement
stockmaster.cors.allowed-origins=${FRONTEND_URL:https://stockmaster.vercel.app}

# ── QR Code ───────────────────────────────────────────────────────────────────
stockmaster.app.url=${FRONTEND_URL:https://stockmaster.vercel.app}

# ── Alertes email (optionnel en prod) ─────────────────────────────────────────
stockmaster.alert.email.to=${ALERT_EMAIL:admin@stockmaster.com}
