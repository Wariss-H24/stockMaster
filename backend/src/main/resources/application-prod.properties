# ══════════════════════════════════════════════════════════════════════════════
# PRODUCTION — Render.com + PostgreSQL
# ══════════════════════════════════════════════════════════════════════════════

# Render donne DATABASE_URL = postgresql://user:pass@host/db
# Le driver JDBC attend   = jdbc:postgresql://host/db?user=...&password=...
# On utilise JDBC_DATABASE_URL que Render génère automatiquement au bon format
# Sinon on force le préfixe jdbc: via SPRING_DATASOURCE_URL (défini dans Render env)
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockmaster}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# H2 désactivé
spring.h2.console.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Port Render
server.port=${PORT:8080}

# CORS
stockmaster.cors.allowed-origins=${FRONTEND_URL:https://stockmaster-frontend.vercel.app}
stockmaster.app.url=${FRONTEND_URL:https://stockmaster-frontend.vercel.app}
stockmaster.alert.email.to=${ALERT_EMAIL:admin@stockmaster.com}
